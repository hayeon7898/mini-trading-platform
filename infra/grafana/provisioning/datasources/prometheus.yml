# Grafana 데이터소스 프로비저닝 (#42)
# uid를 고정해 대시보드 JSON이 이 값으로 데이터소스를 참조하게 한다.
# (uid를 비우면 기동할 때마다 무작위로 생성되어 export한 대시보드가 깨짐)
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy              # Grafana 서버가 대신 조회 (브라우저 → prometheus 직접 접속 불필요)
    url: http://prometheus:9090
    isDefault: true
    editable: false            # 파일이 원본. UI에서 수정 불가
    jsonData:
      # Prometheus scrape_interval(5s)과 맞춤. $__rate_interval 계산의 최소 단위가 됨
      timeInterval: 5s
