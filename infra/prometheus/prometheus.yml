# order-server는 compose 밖에서 같은 Docker 네트워크의 컨테이너(mts-order-server)로 실행한다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: order-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mts-order-server:8080"]

  # 컨슈머 그룹 lag, 파티션 오프셋, ISR·URP (04 실험)
  - job_name: kafka-exporter
    scrape_timeout: 5s
    static_configs:
      - targets: ["kafka-exporter:9308"]