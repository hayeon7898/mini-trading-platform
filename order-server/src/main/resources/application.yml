spring:
  application:
    name: order-server
  datasource:
    # 시간대: 세션을 UTC로 고정해 DB의 NOW()와 앱이 같은 기준을 쓰게 한다.
    url: jdbc:mysql://localhost:3307/trading?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # L1 실험(#15) 결과: 기본값 10에서 500 TPS 처리량 217/s, p95 7.29s → 30에서 497/s, 790ms.
      # 요청 스레드와 체결 시뮬레이터 워커가 같은 풀을 쓴다. (experiments/results/20261019-L1-*)
      maximum-pool-size: 30
  jpa:
    open-in-view: false
    hibernate:
      # 스키마의 단일 출처는 infra/mysql/init/01-schema.sql. Hibernate는 검증만 한다.
      ddl-auto: validate

simulator:
  enabled: ${SIMULATOR_ENABLED:false}
  interval: 100ms
  batch-size: 50
  workers: 2
  price-spread: 0.01

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true