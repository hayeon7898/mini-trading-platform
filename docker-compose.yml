name: mts

# ---------------------------------------------------------------
# Kafka 브로커 공통 설정 (3대가 공유)
# ---------------------------------------------------------------
x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1     # Apache 공식 이미지. 4.x는 ZooKeeper 없이 KRaft만 지원
  mem_limit: 1g
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env
  # 세 브로커가 같은 클러스터 ID를 써야 하나의 클러스터로 묶임 (흔한 함정)
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  # KRaft combined mode: 브로커와 컨트롤러를 한 프로세스에서 실행 (로컬 메모리 절약)
  # 실서비스에서는 보통 컨트롤러를 별도 노드로 분리함
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 리스너 3개: 컨테이너 간 통신(INTERNAL), 호스트 도구용(EXTERNAL), 컨트롤러 합의용(CONTROLLER)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # 컨테이너가 재생성되면 데이터는 사라짐(실험마다 깨끗한 상태로 시작).
  # docker kill / docker start 로 재시작하는 장애 실험에서는 데이터가 유지됨
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  # --- 토픽 기본값 (ARCHITECTURE.md 5절) ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2           # 실험 E1에서 1과 비교
  KAFKA_NUM_PARTITIONS: 6                # 실험 E4에서 3/6/12 비교
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 스크립트로 명시 생성해 설정을 통제
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  # --- 내부 토픽도 3중 복제 ---
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

services:
  # ---------------------------------------------------------------
  # MySQL: 주문·체결 원장 DB (CDC 원천)
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4.8          # 8.0은 2026-04 EOL → 8.4 LTS
    container_name: mts-mysql   # 실험 스크립트에서 docker kill 대상으로 쓰기 위해 고정
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: trading
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}   # init/02-debezium-user.sh 에서 사용
      TZ: UTC
    ports:
      - "3307:3306"             # 로컬 MySQL(3306)과 충돌 방지. Workbench·로컬 order-server는 3307로 접속
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    # 설정 파일(my.cnf) 대신 실행 옵션으로 전달:
    # Windows 폴더를 마운트하면 파일이 world-writable로 보여 MySQL이 my.cnf를 무시함
    command:
      # --- CDC(Debezium)용 binlog 설정 ---
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW                  # 8.0.34+ deprecated(기본값 ROW)지만 CDC 전제 조건이라 명시
      - --binlog-row-image=FULL              # 변경 전/후 전체 컬럼 기록
      - --binlog-expire-logs-seconds=259200  # binlog 3일 보존
      - --gtid-mode=ON                       # 재시작 시 위치를 트랜잭션 ID로 추적
      - --enforce-gtid-consistency=ON
      # --- 로컬 리소스 ---
      - --innodb-buffer-pool-size=512M
      - --max-connections=300
      # --- DATETIME을 Debezium이 UTC로 해석하므로 서버도 UTC로 통일 ---
      - --default-time-zone=+00:00
    mem_limit: 1g
    healthcheck:
      # -h 127.0.0.1(TCP)로 확인: 초기화 중 임시 서버는 소켓만 열어서
      # localhost(소켓)로 ping하면 init 스크립트가 끝나기 전에 healthy가 됨
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------
  # Kafka: 3 브로커 클러스터 (KRaft combined mode)
  #   컨테이너 내부: kafka-1:9092,kafka-2:9092,kafka-3:9092
  #   호스트:       localhost:19092,localhost:29092,localhost:39092
  # ---------------------------------------------------------------
  kafka-1:
    <<: *kafka-common
    container_name: mts-kafka-1
    hostname: kafka-1
    ports:
      - "19092:19092"         # 호스트에서 접속: localhost:19092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092

  kafka-2:
    <<: *kafka-common
    container_name: mts-kafka-2
    hostname: kafka-2
    ports:
      - "29092:29092"         # 호스트에서 접속: localhost:29092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092

  kafka-3:
    <<: *kafka-common
    container_name: mts-kafka-3
    hostname: kafka-3
    ports:
      - "39092:39092"         # 호스트에서 접속: localhost:39092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092

  # ---------------------------------------------------------------
  # Kafka Connect + Debezium: MySQL binlog → Kafka (CDC)
  #   REST API: http://localhost:8083
  # ---------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:3.6.2.Final   # Debezium 이미지는 Docker Hub가 아닌 quay.io에서 배포
    container_name: mts-connect
    hostname: connect
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: mts-connect
      # Connect가 커넥터 설정·오프셋·상태를 저장하는 내부 토픽 (3중 복제)
      # 오프셋 토픽이 유실되면 커넥터가 어디까지 읽었는지 잃어버림
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      # 커넥터 설정 JSON에 비밀번호를 직접 쓰지 않고 ${env:DEBEZIUM_PASSWORD} 로 참조
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      HEAP_OPTS: -Xms512m -Xmx1g
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connector-plugins > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  mysql-data: