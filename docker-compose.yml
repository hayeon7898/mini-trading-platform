name: mts

services:
  # ---------------------------------------------------------------
  # MySQL: 주문·체결 원장 DB (CDC 원천)
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4.8          # 8.0은 2026-04 EOL → 8.4 LTS
    container_name: mts-mysql   # 실험 스크립트에서 docker kill 대상으로 쓰기 위해 고정
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: trading
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}   # init/02-debezium-user.sh 에서 사용
      TZ: UTC
    ports:
      - "3306:3306"             # Workbench·로컬 order-server 접속용
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      # -h 127.0.0.1(TCP)로 확인: 초기화 중 임시 서버는 소켓만 열어서
      # localhost(소켓)로 ping하면 init 스크립트가 끝나기 전에 healthy가 됨
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql-data: