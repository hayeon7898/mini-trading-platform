name: mts

# ---------------------------------------------------------------
# Kafka 브로커 공통 설정 (3대가 공유)
# ---------------------------------------------------------------
x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1     # Apache 공식 이미지. 4.x는 ZooKeeper 없이 KRaft만 지원
  mem_limit: 1g
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env
  # 세 브로커가 같은 클러스터 ID를 써야 하나의 클러스터로 묶임 (흔한 함정)
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  # KRaft combined mode: 브로커와 컨트롤러를 한 프로세스에서 실행 (로컬 메모리 절약)
  # 실서비스에서는 보통 컨트롤러를 별도 노드로 분리함
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 리스너 3개: 컨테이너 간 통신(INTERNAL), 호스트 도구용(EXTERNAL), 컨트롤러 합의용(CONTROLLER)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # 컨테이너가 재생성되면 데이터는 사라짐(실험마다 깨끗한 상태로 시작).
  # docker kill / docker start 로 재시작하는 장애 실험에서는 데이터가 유지됨
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  # --- 토픽 기본값 (ARCHITECTURE.md 5절) ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2           # 실험 E1에서 1과 비교
  KAFKA_NUM_PARTITIONS: 6                # 실험 E4에서 3/6/12 비교
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 스크립트로 명시 생성해 설정을 통제
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  # --- 내부 토픽도 3중 복제 ---
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

services:
  # ---------------------------------------------------------------
  # Prometheus: 모니터링 수집기
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0 
    container_name: mts-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
  # ---------------------------------------------------------------
  # kafka-exporter: 컨슈머 그룹 lag, 파티션 오프셋, ISR·URP → Prometheus
  #   http://localhost:9308/metrics
  # ---------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: mts-kafka-exporter
    command:
      # 브로커 3대를 모두 지정: 장애 실험에서 한 대가 죽어도 메타데이터 조회 유지
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
      # Kafka 4.x는 구버전 프로토콜이 제거됨 → 클라이언트(sarama) 프로토콜 버전을 명시
      - --kafka.version=3.6.0
    ports:
      - "9308:9308"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    # 기동 시 브로커 접속 실패하면 종료되므로 자동 재시작 (장애 실험 중 대비)
    restart: unless-stopped
    mem_limit: 128m
  # ---------------------------------------------------------------
  # Grafana: 대시보드 (#42)
  #   http://localhost:3000  (admin / .env의 GRAFANA_ADMIN_PASSWORD)
  #   데이터소스·대시보드는 infra/grafana/provisioning의 파일이 원본.
  #   볼륨을 두지 않음 → 재생성하면 UI에서 만든 것은 사라지고 파일 기준으로 다시 뜸
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.4   # 13.2 (현재 지원 중인 최신 minor)
    container_name: mts-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 기동 시 외부 접속을 막아 재현성 확보: 기본 플러그인 자동 설치·업데이트 확인·사용 통계 전송 끔
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus   # Prometheus는 healthcheck가 없어 기동 순서만 보장
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  # ---------------------------------------------------------------
  # MySQL: 주문·체결 원장 DB (CDC 원천)
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4.8          # 8.0은 2026-04 EOL → 8.4 LTS
    container_name: mts-mysql   # 실험 스크립트에서 docker kill 대상으로 쓰기 위해 고정
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: trading
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}   # init/02-debezium-user.sh 에서 사용
      TZ: UTC
    ports:
      - "3307:3306"             # 로컬 MySQL(3306)과 충돌 방지. Workbench·로컬 order-server는 3307로 접속
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    # 설정 파일(my.cnf) 대신 실행 옵션으로 전달:
    # Windows 폴더를 마운트하면 파일이 world-writable로 보여 MySQL이 my.cnf를 무시함
    command:
      # --- CDC(Debezium)용 binlog 설정 ---
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW                  # 8.0.34+ deprecated(기본값 ROW)지만 CDC 전제 조건이라 명시
      - --binlog-row-image=FULL              # 변경 전/후 전체 컬럼 기록
      - --binlog-expire-logs-seconds=259200  # binlog 3일 보존
      - --gtid-mode=ON                       # 재시작 시 위치를 트랜잭션 ID로 추적
      - --enforce-gtid-consistency=ON
      # --- 로컬 리소스 ---
      - --innodb-buffer-pool-size=512M
      - --max-connections=300
      # --- DATETIME을 Debezium이 UTC로 해석하므로 서버도 UTC로 통일 ---
      - --default-time-zone=+00:00
    mem_limit: 1g
    healthcheck:
      # -h 127.0.0.1(TCP)로 확인: 초기화 중 임시 서버는 소켓만 열어서
      # localhost(소켓)로 ping하면 init 스크립트가 끝나기 전에 healthy가 됨
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------
  # order-server: 주문 접수 API + 체결 시뮬레이터 (#46)
  #   http://localhost:8080  (컨테이너 간: mts-order-server:8080)
  #   이미지는 order-server/Dockerfile로 빌드. 코드를 바꾸면 docker compose up -d --build order-server
  #   호스트에서 ./gradlew bootRun 으로 띄울 때는 이 서비스를 멈추고 실행 (포트 8080 충돌)
  # ---------------------------------------------------------------
  order-server:
    build: ./order-server
    image: mts-order-server:local   # 로컬 빌드 이미지 이름 (latest 태그 회피)
    container_name: mts-order-server   # 실험 스크립트·Prometheus·k6가 이 이름으로 접속
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # application.yml 기본값(localhost:3307)은 호스트 실행용. 컨테이너에서는 서비스 이름으로 접속
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trading?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=false
      # 체결 시뮬레이터. 조회 성능 실험 등 체결이 방해되면 SIMULATOR_ENABLED=false docker compose up -d order-server
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1g                    # 힙은 Dockerfile의 MaxRAMPercentage=75 → 약 768MB
    healthcheck:
      # liveness가 아닌 readiness: "요청을 받을 준비가 됐는가"를 본다 → --wait 후 바로 부하를 걸어도 안전
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s              # 기동에 22~40초 걸림 (#45 Troubleshooting)

  # ---------------------------------------------------------------
  # Kafka: 3 브로커 클러스터 (KRaft combined mode)
  #   컨테이너 내부: kafka-1:9092,kafka-2:9092,kafka-3:9092
  #   호스트:       localhost:19092,localhost:29092,localhost:39092
  # ---------------------------------------------------------------
  kafka-1:
    <<: *kafka-common
    container_name: mts-kafka-1
    hostname: kafka-1
    ports:
      - "19092:19092"         # 호스트에서 접속: localhost:19092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092

  kafka-2:
    <<: *kafka-common
    container_name: mts-kafka-2
    hostname: kafka-2
    ports:
      - "29092:29092"         # 호스트에서 접속: localhost:29092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092

  kafka-3:
    <<: *kafka-common
    container_name: mts-kafka-3
    hostname: kafka-3
    ports:
      - "39092:39092"         # 호스트에서 접속: localhost:39092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092

  # ---------------------------------------------------------------
  # Kafka Connect + Debezium: MySQL binlog → Kafka (CDC)
  #   REST API: http://localhost:8083
  # ---------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:3.6.2.Final   # Debezium 이미지는 Docker Hub가 아닌 quay.io에서 배포
    entrypoint: ["sh", "-c", "mkdir -p /tmp/connect-plugins && cp -r /kafka/connect/debezium-connector-mysql /tmp/connect-plugins/ && exec /docker-entrypoint.sh start"]
    container_name: mts-connect
    hostname: connect
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: mts-connect
      # Connect가 커넥터 설정·오프셋·상태를 저장하는 내부 토픽 (3중 복제)
      # 오프셋 토픽이 유실되면 커넥터가 어디까지 읽었는지 잃어버림
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      # CONNECT_ 접두사 환경변수 → 워커 설정(connect-distributed.properties) 항목으로 변환됨
      # 기본 설정 파일에 복제 수 1이 명시돼 있어 반드시 덮어써야 함
      # (1로 생성되면 min.insync.replicas=2를 만족 못 해 오프셋 저장이 실패함)
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      # 커넥터 설정 JSON에 비밀번호를 직접 쓰지 않고 ${env:DEBEZIUM_PASSWORD} 로 참조
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      HEAP_OPTS: -Xms512m -Xmx1g
      # E2 조치: 오프셋 저장 주기 60초 → 5초 (강제 종료 시 재발행 범위 축소)
      # 이 이미지는 CONNECT_ 접두사가 아닌 이 변수로 지정해야 반영됨
      OFFSET_FLUSH_INTERVAL_MS: 5000
      # E2 조치: entrypoint가 만든 MySQL 커넥터 전용 상위 폴더 (재기동 시 전체 플러그인 스캔 약 75초 제거)
      CONNECT_PLUGIN_PATH: /tmp/connect-plugins
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connector-plugins > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # ---------------------------------------------------------------
  # ClickHouse: 실시간 분석 저장소 (OLAP)
  #   HTTP: http://localhost:8123   Native: localhost:9000
  # ---------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.8.8   # 26.8 LTS
    container_name: mts-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"     # HTTP 인터페이스 (curl, DBeaver 등)
      - "9000:9000"     # Native 프로토콜 (clickhouse-client)
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: mts
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1   # SQL로 사용자·권한 관리 허용
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # 스펙 03의 Kafka 엔진·MV·타깃 테이블 SQL을 여기에 추가 (볼륨이 비었을 때 1회 실행)
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:             # 공식 권장값: 컬럼별로 파일을 다루므로 파일 핸들을 많이 씀
        soft: 262144
        hard: 262144
    mem_limit: 2g       # 서버 메모리 상한은 컨테이너 제한(cgroup)을 기준으로 자동 계산됨
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql-data:
  clickhouse-data: