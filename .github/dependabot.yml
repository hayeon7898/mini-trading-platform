# 의존성 버전 업데이트 PR 자동 생성
# 커밋 메시지를 chore(deps): ... 로 맞춰 commit-lint를 통과하게 함
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # order-server 생성 후부터 동작 (그 전에는 대상 파일이 없어 무시됨)
  - package-ecosystem: gradle
    directory: /order-server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
