# order-server 빌드·테스트(CI)와 컨테이너 이미지 배포(CD)
name: order-server

on:
  pull_request:
    paths:
      - "order-server/**"
      - ".github/workflows/order-server.yml"
  push:
    branches: [main]
    paths:
      - "order-server/**"
      - ".github/workflows/order-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # order-server 프로젝트 생성 전에는 빌드를 건너뜀 (워크플로 파일만 바뀐 PR 대비)
      - name: 프로젝트 확인
        id: check
        run: |
          if [ -f order-server/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::order-server 프로젝트가 아직 없어 빌드를 건너뜁니다."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.check.outputs.exists == 'true'

      # Testcontainers(MySQL 등) 테스트도 GitHub 러너의 Docker로 그대로 동작
      - name: Build & test
        if: steps.check.outputs.exists == 'true'
        working-directory: order-server
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: order-server/build/reports/tests/

  publish:
    name: Publish image (GHCR)
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile 확인
        id: check
        run: |
          if [ -f order-server/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::order-server/Dockerfile 이 아직 없어 이미지 빌드를 건너뜁니다."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR 이미지 이름은 소문자여야 함
      - name: 이미지 이름
        id: image
        if: steps.check.outputs.exists == 'true'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/order-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.exists == 'true'

      - uses: docker/login-action@v4
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 태그 대신 커밋 SHA로 버전 고정
      - id: meta
        if: steps.check.outputs.exists == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.exists == 'true'
        with:
          context: order-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max